name: env-branch-policy-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: print ref and request an OIDC token
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
          HTTP=$(curl -sS -o idtoken.json -w '%{http_code}' -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL")
          echo "oidc_http=$HTTP"
          echo "jwt_len=$(jq -r '.value // empty' idtoken.json | wc -c)"
